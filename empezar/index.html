    }).catch(function () {
      if (btn) { btn.disabled = false; if (btn.id === "pagar") btn.innerHTML = ICON.candado + "Pagar con tarjeta"; }
      err.innerHTML = 'No hemos podido abrir el pago. Inténtalo de nuevo o <a href="' + WA + encodeURIComponent("Hola, quiero activar el plan " + PLAN[st.plan].n + " y no me deja pagar en la web.") + '" target="_blank" rel="noopener" style="color:#b3261e;font-weight:700">escríbenos por WhatsApp</a>.';
    });
  }
  /* ---------- navegación ---------- */
  function refrescar(mismoPaso) {
    pintarProg(); pintarResumen(); urlEstado();
    if (mismoPaso && st.paso === 1) { app.querySelectorAll(".plan").forEach(function (b) { b.setAttribute("aria-checked", String(b.dataset.plan === st.plan)); }); var n = app.querySelector(".nota"); if (n) n.textContent = st.plan === "content" ? "Con Content pagas y empiezas: después nos cuentas tu negocio y reservas tu Content Day." : "Growth y Scale empiezan con una videollamada de 30 minutos para conocer tu negocio, sin compromiso."; return; }
    [null, paso1, paso2, paso3][st.paso]();
    track("empezar_paso", { paso: st.paso, plan: st.plan });
  }
  function ir(n) { st.paso = Math.min(3, Math.max(1, n)); refrescar(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  document.addEventListener("click", function (e) {
    if (e.target.closest("[data-sig]")) ir(st.paso + 1);
    else if (e.target.closest("[data-ant]")) ir(st.paso - 1);
    else { var p = e.target.closest(".prog button"); if (p && !p.disabled) ir(+p.dataset.ir); }
  });
  document.getElementById("b-btn").addEventListener("click", function () {
    if (st.paso < 3) return ir(st.paso + 1);
    if (conReu()) agendar(); else pagar();
  });
  refrescar();
})();
</script>
</body>
</html>
