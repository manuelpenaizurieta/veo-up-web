<!-- Reserva del Content Day (Manu y Stevan, 2026-11-16): sustituye a la página de citas de Google, que obligaba a
     repetir nombre, apellidos, teléfono y email. Llega desde el correo de bienvenida: /reservar/?ref=<Submission ID>.
     Los datos salen del formulario; el cliente solo elige día y hora y confirma el nombre del negocio.
     Habla con la web app del script «VEO UP · Reservas Content Day» (Apps Script en start@): accion=huecos / reservar.
     Vista de diseño sin datos reales: /reservar/#demo -->
<script>
  window.RESERVAS_URL = "https://script.google.com/macros/s/AKfycbymxjBtTayemeeaILYYCc_IypjVeiP6f5LJiQaYFMQ8XzAlx6UWPOoWc4HtdZ9Jx8dQsA/exec";   // web app «VEO UP · Reservas Content Day» (start@), versión 1
  window.GTM_ID = "GTM-MJM75GLF";
  window.dataLayer = window.dataLayer || [];
  var veoQueue = [];
  window.track = function (event, params) {
    var e = Object.assign({ event: event }, params || {});
    if (window.__gtmLoaded) window.dataLayer.push(e); else veoQueue.push(e);
  };
  try { window.__veoInterno = localStorage.getItem("veoup-interno") === "1"; } catch (e) { window.__veoInterno = false; }
  window.loadGTM = function () {
    if (!window.GTM_ID || window.__gtmLoaded || window.__veoInterno) return;
    window.__gtmLoaded = true;
    window.dataLayer.push({ "gtm.start": Date.now(), event: "gtm.js" });
    veoQueue.forEach(function (e) { window.dataLayer.push(e); }); veoQueue = [];
    var s = document.createElement("script"); s.async = true;
    s.src = "https://www.googletagmanager.com/gtm.js?id=" + window.GTM_ID;
    document.head.appendChild(s);
  };
  try { if (localStorage.getItem("veoup-consent") === "si") window.loadGTM(); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root { --black: #101010; --cream: #F7F7F2; --green: #38D66B; --grey: #EAECE9; --line: #E2E4DF; --muted: #5a5d59; --green-ink: #1E8A43; --green-bg: #DDF6E5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--black); font: 16px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .top { max-width: 680px; margin: 0 auto; padding: 20px 16px 0; display: flex; justify-content: space-between; align-items: center; }
  .top img { display: block; width: 112px; height: auto; }
  .top span { font-size: 13px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .top svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  main { max-width: 680px; margin: 0 auto; padding: 28px 16px 64px; }
  .k { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--green-ink); margin: 0 0 8px; }
  h1 { font: 700 clamp(28px, 6.5vw, 40px)/1.08 Sora, Inter, sans-serif; letter-spacing: -.025em; margin: 0 0 10px; }
  .lede { font-size: 17px; color: #3a3d39; margin: 0 0 26px; }
  .card { background: #fff; border-radius: 22px; padding: 20px; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 10px 32px rgba(16,16,16,.06); margin: 0 0 16px; }
  .paso { display: flex; align-items: center; gap: 10px; font: 700 15px Sora, Inter, sans-serif; margin: 0 0 14px; }
  .paso i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; background: var(--black); color: #fff; display: grid; place-items: center; font-size: 13px; }
  label.campo { display: block; font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  input.txt { width: 100%; height: 52px; border: 1.5px solid #d9dbd7; border-radius: 14px; padding: 0 16px; font: 500 16px Inter, sans-serif; color: var(--black); background: #fff; }
  input.txt:focus { outline: none; border-color: var(--black); box-shadow: 0 0 0 4px rgba(16,16,16,.08); }
  .ayuda { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  .dias { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -4px; scroll-snap-type: x proximity; scrollbar-width: thin; }
  .dia { all: unset; box-sizing: border-box; flex: none; width: 74px; padding: 10px 6px; border-radius: 16px; border: 1.5px solid var(--line); text-align: center; cursor: pointer; scroll-snap-align: start; background: #fff; transition: border-color .15s, background .15s; }
  .dia small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: capitalize; }
  .dia b { display: block; font: 700 22px/1.15 Sora, Inter, sans-serif; margin: 2px 0; }
  .dia span { display: block; font-size: 11.5px; color: var(--muted); text-transform: capitalize; }
  .dia:hover { border-color: #b9bcb6; }
  .dia[aria-pressed="true"] { background: var(--black); border-color: var(--black); color: #fff; }
  .dia[aria-pressed="true"] small, .dia[aria-pressed="true"] span { color: #c9ccc7; }
  .dia:focus-visible, .hora:focus-visible, .btn:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  .horas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 6px 0 0; }
  .hora { all: unset; box-sizing: border-box; height: 52px; border-radius: 14px; border: 1.5px solid var(--line); display: grid; place-items: center; font: 700 16px Inter, sans-serif; cursor: pointer; background: #fff; font-variant-numeric: tabular-nums; transition: border-color .15s, background .15s; }
  .hora small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); margin-top: -6px; }
  .hora:hover { border-color: #b9bcb6; }
  .hora[aria-pressed="true"] { background: var(--green); border-color: var(--green); }
  .hora[aria-pressed="true"] small { color: #10421f; }
  .franja { grid-column: 1 / -1; margin: 8px 0 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .franja:first-child { margin-top: 0; }
  @media (max-width: 420px) { .horas { grid-template-columns: repeat(3, minmax(0, 1fr)); } .hora { height: 48px; font-size: 15px; } }
  .resumen { display: flex; gap: 12px; align-items: center; background: var(--green-bg); border-radius: 16px; padding: 14px 16px; margin: 0 0 14px; font-size: 15px; }
  .resumen svg { flex: none; width: 22px; height: 22px; fill: none; stroke: var(--green-ink); stroke-width: 2; stroke-linecap: round; }
  .resumen[hidden] { display: none; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 58px; border: 0; border-radius: 999px; background: var(--green); color: var(--black); font: 700 17px Inter, sans-serif; cursor: pointer; box-shadow: 0 8px 24px rgba(56,214,107,.35); transition: transform .15s, box-shadow .15s, opacity .15s; text-decoration: none; }
  .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(56,214,107,.45); }
  .btn:disabled { opacity: .5; cursor: default; box-shadow: none; }
  .btn.sec { background: #fff; box-shadow: none; border: 1.5px solid var(--line); }
  .btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: g .7s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  .error { color: #b3261e; font-size: 14px; margin: 12px 0 0; min-height: 1em; }
  .esq { height: 74px; border-radius: 16px; background: linear-gradient(90deg, #eeefea 0%, #f6f7f2 50%, #eeefea 100%); background-size: 200% 100%; animation: brillo 1.2s infinite; }
  @keyframes brillo { to { background-position: -200% 0; } }
  .estado { text-align: center; padding: 28px 8px 8px; }
  .estado .ic { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; margin: 0 auto 18px; background: var(--green-bg); }
  .estado .ic svg { width: 30px; height: 30px; fill: none; stroke: var(--green-ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .estado .ic.no { background: #fbeae8; } .estado .ic.no svg { stroke: #b3261e; }
  .estado h2 { font: 700 26px/1.15 Sora, Inter, sans-serif; letter-spacing: -.02em; margin: 0 0 8px; }
  .estado p { margin: 0 auto 18px; color: #3a3d39; max-width: 46ch; }
  .estado .fecha { font: 700 20px/1.3 Sora, Inter, sans-serif; color: var(--black); margin: 0 0 18px; }
  .acciones { display: grid; gap: 10px; max-width: 360px; margin: 0 auto; }
  .lista { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 10px; font-size: 14px; color: #3a3d39; }
  .lista li { display: grid; grid-template-columns: 20px 1fr; gap: 10px; }
  .lista svg { width: 18px; height: 18px; margin-top: 2px; fill: none; stroke: #1f9d4c; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .help { margin: 26px 0 0; font-size: 14px; color: var(--muted); text-align: center; }
  .help a { color: var(--black); font-weight: 600; }
  .vacio { padding: 16px; border: 1.5px dashed var(--line); border-radius: 14px; color: var(--muted); font-size: 14px; text-align: center; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .spin, .esq { animation: none; } .btn, .dia, .hora { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <a href="/" aria-label="VEO UP, ir a la web"><img src="/media/firma-logo.png" width="176" height="52" alt="VEO UP"></a>
  <span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.6"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Content Day</span>
</header>
<main id="app" aria-live="polite">
  <div class="esq" style="height:44px;width:70%;margin:0 0 14px"></div>
  <div class="esq" style="height:22px;width:90%;margin:0 0 30px"></div>
  <div class="esq" style="height:180px"></div>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search), ref = (q.get("ref") || "").replace(/[^A-Za-z0-9_-]/g, "");
  var DEMO = location.hash === "#demo", app = document.getElementById("app");
  var WA = "https://wa.me/34611216083?text=";
  var ICON = {
    flecha: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    ok: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    no: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>',
    cal: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.6"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>'
  };
  var esc = function (t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var TZ = "Europe/Madrid";
  var diaClave = function (d) { return d.toLocaleDateString("en-CA", { timeZone: TZ }); };
  var hora = function (d) { return d.toLocaleTimeString("es-ES", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hourCycle: "h23" }); };
  var largo = function (d) { var t = d.toLocaleDateString("es-ES", { timeZone: TZ, weekday: "long", day: "numeric", month: "long" }) + " a las " + hora(d); return t.charAt(0).toUpperCase() + t.slice(1); };
  function api(params) {
    if (DEMO) return demo(params);
    var u = window.RESERVAS_URL + "?" + new URLSearchParams(params).toString();
    return fetch(u).then(function (r) { return r.json(); });
  }
  /* Vista de diseño (#demo): datos inventados, no reserva nada */
  function demo(p) {
    return new Promise(function (res) { setTimeout(function () {
      if (p.accion === "reservar") return res({ ok: true, inicio: p.ini });
      var out = [], base = new Date(); base.setHours(0, 0, 0, 0);
      for (var i = 2; i < 22; i++) { var d = new Date(base.getTime() + i * 864e5); if (d.getDay() === 0 || d.getDay() === 6) continue;
        for (var m = 540; m <= 1080; m += 30) { if (i % 3 === 0 && m >= 600 && m < 780) continue; out.push(new Date(d.getTime() + m * 6e4).toISOString()); } }
      res({ ok: true, negocio: "Café Tres Hojas", nombre: "Lucía", reservado: null, huecos: out, duracion: 120, antelacion: 48 });
    }, 500); });
  }
  function pantallaEstado(tipo, titulo, texto, extraHTML) {
    app.innerHTML = '<div class="card estado"><div class="ic' + (tipo === "no" ? " no" : "") + '">' + (tipo === "no" ? ICON.no : ICON.ok) + '</div>'
      + '<h2>' + titulo + '</h2>' + texto + (extraHTML || "") + '</div>' + ayuda();
  }
  function ayuda(t) { return '<p class="help">¿Necesitas otra fecha o tienes dudas? <a href="' + WA + encodeURIComponent(t || "Hola, tengo una duda con la reserva de mi Content Day.") + '" target="_blank" rel="noopener">Escríbenos por WhatsApp</a></p>'; }
  function gcal(ini, min, negocio) {
    var f = function (d) { return d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, ""); };
    var fin = new Date(ini.getTime() + min * 60000);
    return "https://calendar.google.com/calendar/render?" + new URLSearchParams({ action: "TEMPLATE", text: "Content Day · VEO UP", dates: f(ini) + "/" + f(fin),
      details: "Grabación de contenido con VEO UP en " + negocio + ". Dudas: WhatsApp +34 611 21 60 83", ctz: TZ }).toString();
  }
  function hecho(ini, d, negocio) {
    track("reserva_content_day", { origen: "veoup_reservar" });
    pantallaEstado("ok", "¡Content Day reservado!",
      '<p class="fecha">' + esc(largo(ini)) + '</p><p>Te acabamos de enviar la confirmación por email. Antes de la sesión te mandamos la <b>propuesta de contenido</b> que vamos a grabar.</p>',
      '<div class="acciones"><a class="btn" href="' + gcal(ini, d.duracion || 120, negocio) + '" target="_blank" rel="noopener">' + ICON.cal + 'Añadir a mi calendario</a></div>');
  }
  function sinRef() {
    pantallaEstado("no", "Este enlace no funciona", "<p>Para reservar tu Content Day, usa el botón del correo de bienvenida de VEO UP. Si no lo encuentras, escríbenos y te lo reservamos nosotros.</p>",
      '<div class="acciones"><a class="btn" href="' + WA + encodeURIComponent("Hola, quiero reservar mi Content Day.") + '" target="_blank" rel="noopener">Escribir por WhatsApp' + ICON.flecha + '</a></div>');
  }
  function pintar(d) {
    var porDia = {}, orden = [];
    (d.huecos || []).forEach(function (s) { var x = new Date(s), k = diaClave(x); if (!porDia[k]) { porDia[k] = []; orden.push(k); } porDia[k].push(x); });
    var sel = { dia: orden[0] || null, ini: null };
    var nombre = d.nombre ? ", " + esc(d.nombre.split(" ")[0]) : "";
    app.innerHTML =
      '<p class="k">Content Day</p><h1>Elige el día de tu grabación</h1>'
      + '<p class="lede">Hola' + nombre + '. Venimos a tu negocio y grabamos en una sesión de 90 a 120 minutos. Tus datos ya los tenemos: solo elige el día y la hora.</p>'
      + '<section class="card"><div class="paso"><i>1</i>Tu negocio</div>'
      + '<label class="campo" for="negocio">Nombre del negocio</label><input class="txt" id="negocio" maxlength="80" autocomplete="organization" value="' + esc(d.negocio || "") + '">'
      + '<p class="ayuda">Puedes corregirlo si hace falta.</p></section>'
      + '<section class="card"><div class="paso"><i>2</i>Día y hora</div>'
      + (orden.length ? '<div class="dias" id="dias" role="group" aria-label="Días disponibles"></div><div class="horas" id="horas" role="group" aria-label="Horas disponibles"></div>'
        + '<p class="ayuda">Hora de España · reservas con ' + (d.antelacion || 48) + ' h de antelación como mínimo.</p>'
        : '<div class="vacio">Ahora mismo no quedan huecos libres en las próximas semanas. Escríbenos por WhatsApp y te buscamos fecha.</div>')
      + '</section>'
      + '<div class="resumen" id="resumen" hidden>' + ICON.cal + '<span id="r-txt"></span></div>'
      + '<button class="btn" id="reservar" type="button" disabled>Reservar Content Day' + ICON.flecha + '</button>'
      + '<p class="error" id="error" role="alert"></p>'
      + '<ul class="lista"><li>' + ICON.ok + '<span>Te llega la <b>confirmación por email</b> al momento.</span></li>'
      + '<li>' + ICON.ok + '<span>Antes de la sesión te enviamos la <b>propuesta de contenido</b>.</span></li>'
      + '<li>' + ICON.ok + '<span>¿Te surge algo? Cambiamos la fecha por WhatsApp.</span></li></ul>' + ayuda();
    if (!orden.length) return;
    var dias = document.getElementById("dias"), horas = document.getElementById("horas"), btn = document.getElementById("reservar");
    function pintarDias() {
      dias.innerHTML = orden.map(function (k) { var x = porDia[k][0];
        return '<button type="button" class="dia" data-k="' + k + '" aria-pressed="' + (k === sel.dia) + '"><small>' + x.toLocaleDateString("es-ES", { timeZone: TZ, weekday: "short" }).replace(".", "")
          + '</small><b>' + x.toLocaleDateString("es-ES", { timeZone: TZ, day: "numeric" }) + '</b><span>' + x.toLocaleDateString("es-ES", { timeZone: TZ, month: "short" }).replace(".", "") + '</span></button>'; }).join("");
    }
    function pintarHoras() {
      var boton = function (x) { var iso = x.toISOString();
        return '<button type="button" class="hora" data-i="' + iso + '" aria-pressed="' + (sel.ini === iso) + '">' + hora(x) + '</button>'; };
      var lista = porDia[sel.dia] || [], h = function (x) { return Number(hora(x).slice(0, 2)); };
      var man = lista.filter(function (x) { return h(x) < 14; }), tar = lista.filter(function (x) { return h(x) >= 14; });
      horas.innerHTML = (man.length ? '<p class="franja">Mañana</p>' + man.map(boton).join("") : "") + (tar.length ? '<p class="franja">Tarde</p>' + tar.map(boton).join("") : "");
      var r = document.getElementById("resumen");
      if (sel.ini) { r.hidden = false; document.getElementById("r-txt").innerHTML = "<b>" + esc(largo(new Date(sel.ini))) + "</b>"; } else r.hidden = true;
      btn.disabled = !sel.ini;
    }
    dias.addEventListener("click", function (e) { var b = e.target.closest(".dia"); if (!b) return; sel.dia = b.dataset.k; sel.ini = null; pintarDias(); pintarHoras(); });
    horas.addEventListener("click", function (e) { var b = e.target.closest(".hora"); if (!b) return; sel.ini = b.dataset.i; pintarHoras(); });
    pintarDias(); pintarHoras();
    btn.addEventListener("click", function () {
      if (!sel.ini) return;
      var neg = document.getElementById("negocio").value.trim(), err = document.getElementById("error");
      if (!neg) { err.textContent = "Escribe el nombre de tu negocio."; document.getElementById("negocio").focus(); return; }
      btn.disabled = true; btn.innerHTML = '<span class="spin" aria-hidden="true"></span>Reservando…'; err.textContent = "";
      api({ accion: "reservar", ref: ref, ini: sel.ini, negocio: neg }).then(function (r) {
        if (r && r.ok) return hecho(new Date(r.inicio), d, neg);
        if (r && r.error === "ya") return yaReservado(r.reservado);
        if (r && r.error === "hueco") { err.textContent = "Ese hueco se acaba de ocupar. Te mostramos los que quedan libres."; return cargar(true); }
        throw new Error(r && r.error || "error");
      }).catch(function () {
        btn.disabled = false; btn.innerHTML = "Reservar Content Day" + ICON.flecha;
        err.textContent = "No se ha podido reservar. Inténtalo de nuevo o escríbenos por WhatsApp.";
      });
    });
  }
  function yaReservado(res) {
    var ini = res && res.inicio ? new Date(res.inicio) : null;
    pantallaEstado("ok", "Ya tienes tu Content Day", (ini ? '<p class="fecha">' + esc(largo(ini)) + '</p>' : "")
      + "<p>Si necesitas cambiar la fecha, escríbenos y lo movemos.</p>",
      '<div class="acciones"><a class="btn sec" href="' + WA + encodeURIComponent("Hola, quiero cambiar la fecha de mi Content Day.") + '" target="_blank" rel="noopener">Cambiar la fecha por WhatsApp</a></div>');
  }
  function cargar(manteniendoError) {
    if (!ref && !DEMO) return sinRef();
    api({ accion: "huecos", ref: ref }).then(function (d) {
      if (!d || !d.ok) { if (d && d.error === "ref") return sinRef(); throw new Error("api"); }
      if (d.reservado) return yaReservado(d.reservado);
      track("reserva_ver", { huecos: (d.huecos || []).length });
      pintar(d);
      if (manteniendoError) document.getElementById("error").textContent = "Ese hueco se acaba de ocupar. Elige otro, por favor.";
    }).catch(function () {
      pantallaEstado("no", "No hemos podido cargar los huecos", "<p>Recarga la página en un momento. Si sigue sin funcionar, escríbenos y te reservamos nosotros.</p>",
        '<div class="acciones"><button class="btn" type="button" onclick="location.reload()">Volver a intentarlo</button></div>');
    });
  }
  cargar();
})();
</script>
</body>
