  var LOGO = {
    apple: '<svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.15 6.9c-.95 0-2.42-1.08-3.96-1.04-2.04.03-3.91 1.18-4.96 3.01-2.12 3.68-.55 9.1 1.52 12.09 1.01 1.45 2.2 3.09 3.79 3.04 1.52-.07 2.09-.99 3.93-.99 1.83 0 2.35.99 3.96.95 1.64-.03 2.68-1.48 3.68-2.95 1.16-1.69 1.64-3.33 1.66-3.42-.04-.01-3.18-1.22-3.22-4.86-.03-3.04 2.48-4.49 2.6-4.56-1.43-2.09-3.62-2.32-4.39-2.38-2-.16-3.68 1.09-4.61 1.09zm3.38-3.07c.84-1.01 1.4-2.43 1.25-3.83-1.21.05-2.66.8-3.53 1.82-.78.9-1.46 2.34-1.27 3.71 1.34.1 2.71-.69 3.55-1.7z"/></svg>',
    google: '<svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2.5" fill="#fff" stroke="#dadce0"/><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3H12v4H3z" fill="#4285F4"/><path d="M12 3h6.5A2.5 2.5 0 0 1 21 5.5V7h-9z" fill="#EA4335"/><path d="M3 17h4v4H5.5A2.5 2.5 0 0 1 3 18.5z" fill="#34A853"/><path d="M17 17h4v1.5a2.5 2.5 0 0 1-2.5 2.5H17z" fill="#FBBC04"/><text x="12" y="17.6" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="8.5" fill="#4285F4">31</text></svg>',
    outlook: '<svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="4" width="13" height="16" rx="2" fill="#28A8EA"/><path d="M9 11l6.5 4L22 11v7a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2z" fill="#0364B8"/><rect x="2" y="6.5" width="11" height="11" rx="2" fill="#0078D4"/><ellipse cx="7.5" cy="12" rx="2.6" ry="3.1" fill="none" stroke="#fff" stroke-width="1.7"/></svg>'
  };
  function botonesCal(ini, min, negocio) {
    var apple = '<a class="btn cal apple" href="' + esc(icsUrl(ini, negocio)) + '">' + LOGO.apple + 'Calendario de Apple</a>';
    var google = '<a class="btn cal google" href="' + gcal(ini, min, negocio) + '" target="_blank" rel="noopener">' + LOGO.google + 'Calendario de Google</a>';
    var outlook = '<a class="btn cal" href="' + esc(icsUrl(ini, negocio, true)) + '">' + LOGO.outlook + 'Calendario de Outlook</a>';
    return '<div class="acciones cal-opc"><p class="cal-t">' + ICON.cal + 'Añádelo a tu calendario</p>' + (APPLE ? apple + google : google + apple) + outlook + '</div>';
  }
  /* Scale graba 2 Content Days al mes (Manu, 2026-11-26): el script dice cuántos tiene (cuantos) y cuáles ya
     están reservados (reservas). Content y Growth: 1, como siempre. */
  var ORD = ["primer", "segundo", "tercer"], cap = function (t) { return t.charAt(0).toUpperCase() + t.slice(1); };
  function calMini(ini, min, negocio) {
    return '<span class="cal-mini"><a href="' + esc(icsUrl(ini, negocio)) + '" aria-label="Calendario de Apple">' + LOGO.apple + '</a>'
      + '<a href="' + gcal(ini, min, negocio) + '" target="_blank" rel="noopener" aria-label="Calendario de Google">' + LOGO.google + '</a>'
      + '<a href="' + esc(icsUrl(ini, negocio, true)) + '" aria-label="Calendario de Outlook">' + LOGO.outlook + '</a></span>';
  }
  function listaFechas(isos, min, negocio) {
    return '<ul class="fechas">' + isos.map(function (s, i) { var x = new Date(s);
      return '<li><span class="n">' + (i + 1) + '</span><span class="t"><b>' + esc(largo(x)) + '</b><small>Content Day ' + (i + 1) + ' de ' + isos.length + '</small></span>' + calMini(x, min, negocio) + '</li>'; }).join("") + '</ul>'
      + '<p class="cal-t">' + ICON.cal + 'Toca un icono para añadirlo a tu calendario</p>';
  }
  function hecho(isos, d, negocio) {
    track("reserva_content_day", { origen: "veoup_reservar", cuantos: isos.length });
    if (isos.length === 1) {
      var ini = new Date(isos[0]);
      return pantallaEstado("ok", "¡Content Day reservado!",
        '<p class="fecha">' + esc(largo(ini)) + '</p><p>Te acabamos de enviar la confirmación por email. Antes de la sesión te mandamos la <b>propuesta de contenido</b> que vamos a grabar.</p>',
        botonesCal(ini, d.duracion || 120, negocio));
    }
    pantallaEstado("ok", "¡Tus " + isos.length + " Content Days están reservados!",
      '<p>Te acabamos de enviar la confirmación por email. Antes de cada sesión te mandamos la <b>propuesta de contenido</b>.</p>',
      listaFechas(isos, d.duracion || 120, negocio));
  }
  function sinRef() {
    pantallaEstado("no", "Este enlace no funciona", "<p>Para reservar tu Content Day, usa el botón del correo de bienvenida de VEO UP. Si no lo encuentras, escríbenos y te lo reservamos nosotros.</p>",
      '<div class="acciones"><a class="btn" href="' + WA + encodeURIComponent("Hola, quiero reservar mi Content Day.") + '" target="_blank" rel="noopener">Escribir por WhatsApp' + ICON.flecha + '</a></div>');
  }
  function pintar(d) {
    var cuantos = Math.max(1, d.cuantos || 1), ya = (d.reservas || []).map(function (r) { return r.inicio; }).sort(), faltan = Math.max(1, cuantos - ya.length);
    var diasYa = ya.map(function (s) { return diaClave(new Date(s)); });
    var porDia = {}, orden = [];
    (d.huecos || []).forEach(function (s) { var x = new Date(s), k = diaClave(x); if (diasYa.indexOf(k) >= 0) return; if (!porDia[k]) { porDia[k] = []; orden.push(k); } porDia[k].push(x); });
    var sel = { dia: orden[0] || null, slots: [], activo: 0 };
    var varios = cuantos > 1, nombre = d.nombre ? ", " + esc(d.nombre.split(" ")[0]) : "";
    var titulo = !varios ? "Elige el día de tu grabación" : ya.length ? "Elige tu " + ORD[ya.length] + " Content Day" : "Elige los días de tus " + cuantos + " Content Days";
    var lede = !varios ? "Venimos a tu negocio y grabamos en una sesión de 90 a 120 minutos. Tus datos ya los tenemos: solo elige el día y la hora."
      : ya.length ? "Tu plan Scale incluye " + cuantos + " sesiones al mes y ya tienes " + (ya.length === 1 ? "la primera" : ya.length + " reservadas") + ". Elige el día de la siguiente."
      : "Tu plan Scale incluye " + cuantos + " sesiones de grabación al mes, de 90 a 120 minutos cada una. Elige " + cuantos + " días distintos.";
    app.innerHTML =
      '<p class="k">Content Day' + (varios ? " · plan Scale" : "") + '</p><h1>' + titulo + '</h1>'
      + '<p class="lede">Hola' + nombre + '. ' + lede + '</p>'
      + '<section class="card"><div class="paso"><i>1</i>Tu negocio</div>'
      + '<label class="campo" for="negocio">Nombre del negocio</label><input class="txt" id="negocio" maxlength="80" autocomplete="organization" value="' + esc(d.negocio || "") + '">'
      + '<p class="ayuda">Puedes corregirlo si hace falta.</p></section>'
      + '<section class="card"><div class="paso"><i>2</i>' + (varios && faltan > 1 ? "Días y horas" : "Día y hora") + '</div>'
      + (varios ? '<div class="slots" id="slots"></div>' : "")
      + (orden.length ? '<div class="dias" id="dias" role="group" aria-label="Días disponibles"></div><div class="horas" id="horas" role="group" aria-label="Horas disponibles"></div>'
        + '<p class="ayuda">Hora de España · reservas con ' + (d.antelacion || 48) + ' h de antelación como mínimo' + (varios ? " · cada sesión en un día distinto" : "") + '.</p>'
        : '<div class="vacio">Ahora mismo no quedan huecos libres en las próximas semanas. Escríbenos por WhatsApp y te buscamos fecha.</div>')
      + '</section>'
      + '<div class="resumen" id="resumen" hidden>' + ICON.cal + '<span id="r-txt"></span></div>'
      + '<button class="btn espera" id="reservar" type="button" aria-disabled="true"></button>'
      + '<div class="error" id="error" role="alert"></div>'
      + '<ul class="lista"><li>' + ICON.ok + '<span>Te llega la <b>confirmación por email</b> al momento.</span></li>'
      + '<li>' + ICON.ok + '<span>Antes de ' + (varios ? "cada sesión" : "la sesión") + ' te enviamos la <b>propuesta de contenido</b>.</span></li>'
      + '<li>' + ICON.ok + '<span>¿Te surge algo? Cambiamos la fecha por WhatsApp.</span></li></ul>' + ayuda();
    var btn = document.getElementById("reservar");
    if (!orden.length) { btn.hidden = true; return; }
    var dias = document.getElementById("dias"), horas = document.getElementById("horas"), slotsEl = document.getElementById("slots");
    var diasElegidos = function (excepto) { return sel.slots.filter(function (s, i) { return s && i !== excepto; }).map(function (s) { return diaClave(new Date(s)); }); };
    var completo = function () { for (var i = 0; i < faltan; i++) if (!sel.slots[i]) return false; return true; };
    function pintarSlots() {
      if (!slotsEl) return;
      var fijos = ya.map(function (s, i) { return '<div class="slot fijo"><span class="n">' + (i + 1) + '</span><span class="t"><small>' + cap(ORD[i]) + ' Content Day · ya reservado</small><b>' + esc(largo(new Date(s))) + '</b></span></div>'; }).join("");
      var libres = [];
      for (var i = 0; i < faltan; i++) {
        var s = sel.slots[i], num = ya.length + i;
        libres.push('<button type="button" class="slot' + (i === sel.activo ? " on" : "") + (s ? " lleno" : "") + '" data-s="' + i + '" aria-pressed="' + (i === sel.activo) + '"><span class="n">' + (num + 1) + '</span><span class="t"><small>' + cap(ORD[num]) + ' Content Day</small><b>' + (s ? esc(largo(new Date(s))) : (i === sel.activo ? "Elige día y hora abajo" : "Por elegir")) + '</b></span>' + (s ? '<span class="x" data-x="' + i + '" role="button" aria-label="Quitar esta fecha">×</span>' : "") + '</button>');
      }
      slotsEl.innerHTML = fijos + libres.join("");
    }
    function pintarDias() {
      var usados = diasElegidos(sel.activo);
      dias.innerHTML = orden.map(function (k) { var x = porDia[k][0], usado = usados.indexOf(k) >= 0;
        return '<button type="button" class="dia' + (usado ? " usado" : "") + '" data-k="' + k + '" aria-pressed="' + (k === sel.dia) + '"' + (usado ? ' disabled title="Ya tienes un Content Day este día"' : "") + '><small>' + x.toLocaleDateString("es-ES", { timeZone: TZ, weekday: "short" }).replace(".", "")
          + '</small><b>' + x.toLocaleDateString("es-ES", { timeZone: TZ, day: "numeric" }) + '</b><span>' + (usado ? "elegido" : x.toLocaleDateString("es-ES", { timeZone: TZ, month: "short" }).replace(".", "")) + '</span></button>'; }).join("");
    }
    function pintarHoras() {
      var actual = sel.slots[sel.activo];
      var boton = function (x) { var iso = x.toISOString();
        return '<button type="button" class="hora" data-i="' + iso + '" aria-pressed="' + (actual === iso) + '">' + hora(x) + '</button>'; };
      var lista = porDia[sel.dia] || [], h = function (x) { return Number(hora(x).slice(0, 2)); };
      var man = lista.filter(function (x) { return h(x) < 14; }), tar = lista.filter(function (x) { return h(x) >= 14; });
      horas.innerHTML = (man.length ? '<p class="franja">Mañana</p>' + man.map(boton).join("") : "") + (tar.length ? '<p class="franja">Tarde</p>' + tar.map(boton).join("") : "");
      var r = document.getElementById("resumen"), elegidos = sel.slots.filter(Boolean).sort();
      if (elegidos.length) { r.hidden = false; document.getElementById("r-txt").innerHTML = elegidos.map(function (s) { return "<b>" + esc(largo(new Date(s))) + "</b>"; }).join("<br>"); } else r.hidden = true;
      pintarSlots(); etiquetaBoton();
    }
    function etiquetaBoton() {
      var ok = completo(), quedan = faltan - sel.slots.filter(Boolean).length;
      btn.classList.toggle("espera", !ok);
      btn.setAttribute("aria-disabled", String(!ok));
      btn.innerHTML = ok ? (faltan > 1 ? "Reservar mis " + faltan + " Content Days" : "Reservar Content Day") + ICON.flecha
        : faltan > 1 ? (quedan === faltan ? "Elige " + faltan + " días para reservar" : "Elige la fecha del " + ORD[ya.length + sel.activo] + " Content Day")
        : "Elige una hora para reservar";
      if (ok) document.getElementById("error").textContent = "";
    }
    function irASlot(i) {
      sel.activo = i; var s = sel.slots[i];
      var usados = diasElegidos(i);
      sel.dia = s ? diaClave(new Date(s)) : (orden.filter(function (k) { return usados.indexOf(k) < 0; })[0] || sel.dia);
      pintarDias(); pintarHoras();
    }
    if (slotsEl) slotsEl.addEventListener("click", function (e) {
      var x = e.target.closest("[data-x]"); if (x) { sel.slots[+x.dataset.x] = null; irASlot(+x.dataset.x); return; }
      var b = e.target.closest("[data-s]"); if (b) irASlot(+b.dataset.s);
    });
    dias.addEventListener("click", function (e) { var b = e.target.closest(".dia"); if (!b || b.disabled) return; sel.dia = b.dataset.k; pintarDias(); pintarHoras(); });
    horas.addEventListener("click", function (e) {
      var b = e.target.closest(".hora"); if (!b) return;
      sel.slots[sel.activo] = b.dataset.i;
      var sig = -1; for (var i = 0; i < faltan; i++) if (!sel.slots[i]) { sig = i; break; }
      if (sig >= 0 && sig !== sel.activo) { irASlot(sig); if (slotsEl) slotsEl.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
      else pintarHoras();
    });
    pintarDias(); pintarHoras();
    btn.addEventListener("click", function () {
      var err = document.getElementById("error");
      if (btn.disabled) return;
      if (!completo()) { err.textContent = faltan > 1 ? "Elige día y hora para tus " + faltan + " Content Days." : "Elige una hora para tu Content Day."; horas.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
      var neg = document.getElementById("negocio").value.trim();
      if (!neg) { err.textContent = "Escribe el nombre de tu negocio."; document.getElementById("negocio").focus(); return; }
      var elegidos = sel.slots.slice(0, faltan).sort();
      btn.disabled = true; btn.innerHTML = '<span class="spin" aria-hidden="true"></span>Reservando…'; err.textContent = "";
      api({ accion: "reservar", ref: ref, ini: elegidos.join(","), negocio: neg }).then(function (r) {
        if (r && r.ok) return hecho(ya.concat(r.inicios || [r.inicio]).sort(), d, neg);
        if (r && r.error === "ya") return yaReservado(r.reservas || [r.reservado]);
        if (r && r.error === "hueco") { err.textContent = "Ese hueco se acaba de ocupar. Te mostramos los que quedan libres."; return cargar(true); }
        throw new Error(r && r.error || "error");
      }).catch(function (e) {
        track("reserva_error", { motivo: String(e && e.message || e).slice(0, 80) });
        /* Si la respuesta se perdió por el camino (cobertura, bloqueador), puede que la cita sí se creara: lo comprobamos antes de dar error */
        return api({ accion: "huecos", ref: ref }).then(function (c) {
          if (c && c.reservado) return yaReservado(c.reservas || [c.reservado]);
          throw e;
        }).catch(function () {
          btn.disabled = false; etiquetaBoton();
          var msg = "Hola, quiero reservar mi Content Day " + elegidos.map(function (s) { return "el " + largo(new Date(s)).toLowerCase(); }).join(" y ") + " (" + neg + "). En la web no me deja.";
          err.innerHTML = "No se ha podido reservar desde aquí. Inténtalo de nuevo o mándanos " + (elegidos.length > 1 ? "las fechas" : "la hora") + " por WhatsApp y te " + (elegidos.length > 1 ? "las dejamos reservadas" : "la dejamos reservada") + "."
            + '<a class="btn sec" href="' + WA + encodeURIComponent(msg) + '" target="_blank" rel="noopener">Reservar por WhatsApp' + ICON.flecha + '</a>';
          var h = app.querySelector(".help"); if (h) h.hidden = true;   // un solo botón de WhatsApp por pantalla
        });
      });
    });
  }
  function yaReservado(lista) {
    var isos = (lista || []).filter(function (r) { return r && r.inicio; }).map(function (r) { return r.inicio; }).sort();
    if (isos.length > 1) return pantallaEstado("ok", "Ya tienes tus " + isos.length + " Content Days", "<p>Si necesitas cambiar alguna fecha, escríbenos y la movemos.</p>",
      listaFechas(isos, 120, ""), "Hola, quiero cambiar la fecha de uno de mis Content Days.");
    var ini = isos[0] ? new Date(isos[0]) : null;
    pantallaEstado("ok", "Ya tienes tu Content Day", (ini ? '<p class="fecha">' + esc(largo(ini)) + '</p>' : "")
      + "<p>Si necesitas cambiar la fecha, escríbenos y lo movemos.</p>",
      ini ? botonesCal(ini, 120, "") : "", "Hola, quiero cambiar la fecha de mi Content Day.");
  }
  function cargar(manteniendoError) {
    if (!ref && !DEMO) return sinRef();
    api({ accion: "huecos", ref: ref }).then(function (d) {
      if (!d || !d.ok) { if (d && d.error === "ref") return sinRef(); throw new Error("api"); }
      if (d.reservado) return yaReservado(d.reservas || [d.reservado]);
      track("reserva_ver", { huecos: (d.huecos || []).length, cuantos: d.cuantos || 1 });
      pintar(d);
      if (manteniendoError) document.getElementById("error").textContent = "Ese hueco se acaba de ocupar. Elige otro, por favor.";
    }).catch(function () {
      pantallaEstado("no", "No hemos podido cargar los huecos", "<p>Recarga la página en un momento. Si sigue sin funcionar, escríbenos y te reservamos nosotros.</p>",
        '<div class="acciones"><button class="btn" type="button" onclick="location.reload()">Volver a intentarlo</button></div>');
    });
  }
  cargar();
})();
</script>
</body>
</html>
