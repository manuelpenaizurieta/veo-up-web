      + campo("nombre", "Nombre", "text", "given-name", true) + campo("apellidos", "Apellidos", "text", "family-name", false)
      + campo("email", "Email", "email", "email", true) + campo("telefono", "WhatsApp", "tel", "tel", true, "+34 600 00 00 00")
      + campo("negocio", "Nombre del negocio", "text", "organization", true) + campo("web", "Web", "url", "url", false, "www.tunegocio.es")
      + '</div><div class="grid2" style="margin-top:12px">' + campo("redes", "Instagram u otras redes", "text", "off", false, "@tunegocio") + '</div>'
      + '<div class="trampa" aria-hidden="true"><label for="web_url">No rellenar</label><input id="web_url" tabindex="-1" autocomplete="off"></div></section>'
      + '<section class="card"><div class="paso"><i>3</i>Día y hora</div>'
      + (orden.length ? '<div class="dias" id="dias" role="group" aria-label="Días disponibles"></div><div class="horas" id="horas" role="group" aria-label="Horas disponibles"></div>'
        + '<p class="ayuda">Hora de España · videollamada por Google Meet · te llega la invitación al email.</p>'
        : '<div class="vacio">Ahora mismo no quedan huecos libres. Escríbenos por WhatsApp y te buscamos hora.</div>')
      + '</section>'
      + '<div class="resumen" id="resumen" hidden>' + ICON.cal + '<span id="r-txt"></span></div>'
      + '<button class="btn espera" id="enviar" type="button" aria-disabled="true">Elige día y hora</button>'
      + '<div class="error" id="error" role="alert"></div>'
      + '<ul class="lista"><li>' + ICON.ok + '<span>Te llega la <b>invitación con el enlace de Meet</b> al momento.</span></li>'
      + '<li>' + ICON.ok + '<span>Hablamos de tu negocio, tus objetivos y qué plan te encaja.</span></li>'
      + '<li>' + ICON.ok + '<span>Sin compromiso: si te convence, contratas después desde la web.</span></li></ul>' + ayuda();
    var planes = app.querySelector(".planes-r"), btn = document.getElementById("enviar"), err = document.getElementById("error");
    function pintarPlanes() { planes.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.plan === sel.plan)); }); }
    planes.addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; sel.plan = b.dataset.plan; pintarPlanes(); });
    pintarPlanes();
    if (!orden.length) { btn.hidden = true; return; }
    var dias = document.getElementById("dias"), horas = document.getElementById("horas");
    function pintarDias() {
      dias.innerHTML = orden.map(function (k) { var x = porDia[k][0];
        return '<button type="button" class="dia" data-k="' + k + '" aria-pressed="' + (k === sel.dia) + '"><small>' + x.toLocaleDateString("es-ES", { timeZone: TZ, weekday: "short" }).replace(".", "")
          + '</small><b>' + x.toLocaleDateString("es-ES", { timeZone: TZ, day: "numeric" }) + '</b><span>' + x.toLocaleDateString("es-ES", { timeZone: TZ, month: "short" }).replace(".", "") + '</span></button>'; }).join("");
    }
    function pintarHoras() {
      var lista = porDia[sel.dia] || [], h = function (x) { return Number(hora(x).slice(0, 2)); };
      var boton = function (x) { var iso = x.toISOString(); return '<button type="button" class="hora" data-i="' + iso + '" aria-pressed="' + (sel.ini === iso) + '">' + hora(x) + '</button>'; };
      var man = lista.filter(function (x) { return h(x) < 14; }), tar = lista.filter(function (x) { return h(x) >= 14; });
      horas.innerHTML = (man.length ? '<p class="franja">Mañana</p>' + man.map(boton).join("") : "") + (tar.length ? '<p class="franja">Tarde</p>' + tar.map(boton).join("") : "");
      var r = document.getElementById("resumen");
      if (sel.ini) { r.hidden = false; document.getElementById("r-txt").innerHTML = "<b>" + esc(largo(new Date(sel.ini))) + "</b> · 30 min por videollamada"; } else r.hidden = true;
      btn.classList.toggle("espera", !sel.ini); btn.setAttribute("aria-disabled", String(!sel.ini));
      btn.innerHTML = sel.ini ? "Agendar la reunión" + ICON.flecha : "Elige día y hora";
    }
    dias.addEventListener("click", function (e) { var b = e.target.closest(".dia"); if (!b) return; sel.dia = b.dataset.k; sel.ini = null; pintarDias(); pintarHoras(); });
    horas.addEventListener("click", function (e) { var b = e.target.closest(".hora"); if (!b) return; sel.ini = b.dataset.i; pintarHoras(); err.textContent = ""; });
    pintarDias(); pintarHoras();
    function val(id) { return document.getElementById(id).value.trim(); }
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      app.querySelectorAll("input.txt").forEach(function (i) { i.classList.remove("mal"); });
      var falta = [["nombre", val("nombre")], ["email", /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val("email")) ? "ok" : ""], ["telefono", val("telefono").replace(/\D/g, "").length >= 9 ? "ok" : ""], ["negocio", val("negocio")]].filter(function (x) { return !x[1]; });
      if (falta.length) {
        falta.forEach(function (x) { document.getElementById(x[0]).classList.add("mal"); });
        err.textContent = "Revisa los datos marcados: nombre, email, WhatsApp (9 cifras o más) y nombre del negocio.";
        document.getElementById(falta[0][0]).focus(); return;
      }
      if (!sel.ini) { err.textContent = "Elige el día y la hora de la reunión."; horas.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
      btn.disabled = true; btn.innerHTML = '<span class="spin" aria-hidden="true"></span>Agendando…'; err.textContent = "";
      var datos = { accion: "reunion", ini: sel.ini, plan: sel.plan, nombre: val("nombre"), apellidos: val("apellidos"), email: val("email"), telefono: val("telefono"),
        negocio: val("negocio"), web: val("web"), redes: val("redes"), web_url: val("web_url") };
      api(datos).then(function (r) {
        if (r && r.ok) return hecho(r);
        if (r && r.error === "ya") return pantallaEstado("ok", "Ya tienes una reunión agendada", '<p class="fecha">' + esc(largo(new Date(r.reunion.inicio))) + '</p><p>Si necesitas cambiarla, escríbenos por WhatsApp.</p>');
        if (r && r.error === "hueco") { err.textContent = "Esa hora se acaba de ocupar. Elige otra, por favor."; return cargar(true); }
        if (r && r.error === "datos") throw new Error("datos");
        throw new Error(r && r.error || "error");
      }).catch(function (e) {
        track("reunion_error", { motivo: String(e && e.message || e).slice(0, 80) });
        btn.disabled = false; pintarHoras();
        var msg = "Hola, soy " + val("nombre") + " de " + val("negocio") + ". Quiero agendar la reunión del plan " + (sel.plan === "scale" ? "Scale" : "Growth") + " el " + largo(new Date(sel.ini)).toLowerCase() + ". En la web no me deja.";
        err.innerHTML = (e && e.message === "datos" ? "Revisa tus datos, hay alguno que no es válido." : "No se ha podido agendar desde aquí. Inténtalo de nuevo o escríbenos y te la dejamos agendada.")
          + '<a class="btn sec" href="' + WA + encodeURIComponent(msg) + '" target="_blank" rel="noopener">Agendar por WhatsApp' + ICON.flecha + '</a>';
      });
    });
  }
  function hecho(r) {
    var ini = new Date(r.inicio);
    track("reunion_agendada", { plan: sel.plan });
    pantallaEstado("ok", "¡Reunión agendada!",
      '<p class="fecha">' + esc(largo(ini)) + '</p><p>Te hemos enviado la <b>invitación al email</b> con el enlace de la videollamada. Hablamos de tu negocio y, si te encaja, después contratas tu plan desde la web.</p>'
      + (r.meet ? '<p><a class="meet" href="' + esc(r.meet) + '" target="_blank" rel="noopener">' + ICON.video + 'Enlace de Google Meet</a></p>' : ""),
      '<div class="acciones"><a class="btn cal" href="' + gcal(ini, r.duracion || 30, r.meet) + '" target="_blank" rel="noopener">Añadir a mi calendario</a></div>');
  }
  function cargar(manteniendoError) {
    api({ accion: "huecos_reunion" }).then(function (d) {
      if (!d || !d.ok) throw new Error("api");
      if (manteniendoError) {   // conservar lo escrito al recargar huecos
        var guard = {}; app.querySelectorAll("input").forEach(function (i) { guard[i.id] = i.value; });
        sel.ini = null; pintar(d); Object.keys(guard).forEach(function (k) { var i = document.getElementById(k); if (i) i.value = guard[k]; });
        document.getElementById("error").textContent = "Esa hora se acaba de ocupar. Elige otra, por favor.";
        return;
      }
      track("reunion_ver", { plan: sel.plan }); pintar(d);
    }).catch(function () {
      pantallaEstado("no", "No hemos podido cargar los huecos", "<p>Recarga la página en un momento o escríbenos por WhatsApp y te buscamos hora.</p>",
        '<div class="acciones"><button class="btn" type="button" onclick="location.reload()">Volver a intentarlo</button></div>');
    });
  }
  cargar();
})();
</script>
</body>
</html>
